services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance_fraud_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_fraud}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/migrations/001_create_insurance_schema.sql:/docker-entrypoint-initdb.d/001_create_insurance_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-insurance_user} -d $${POSTGRES_DB:-insurance_fraud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance_fraud_api
    environment:
      APP_NAME: ${APP_NAME:-sql-instruct-qlora-llm}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://insurance_user:insurance_password@postgres:5432/insurance_fraud}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      PGVECTOR_DIMENSION: ${PGVECTOR_DIMENSION:-128}
      SQL_DEFAULT_LIMIT: ${SQL_DEFAULT_LIMIT:-100}
      SQL_MAX_LIMIT: ${SQL_MAX_LIMIT:-1000}
      SQL_ALLOWED_SCHEMAS: ${SQL_ALLOWED_SCHEMAS:-public}
      SQL_EXECUTION_DEFAULT_LIMIT: ${SQL_EXECUTION_DEFAULT_LIMIT:-100}
      SQL_EXECUTION_MAX_LIMIT: ${SQL_EXECUTION_MAX_LIMIT:-1000}
      SQL_MODEL_BASE_ID: ${SQL_MODEL_BASE_ID:-tiiuae/falcon-11B}
      SQL_MODEL_ADAPTER_DIR: ${SQL_MODEL_ADAPTER_DIR:-models/sql_lora_adapter}
      SQL_MODEL_OUTPUT_DIR: ${SQL_MODEL_OUTPUT_DIR:-artifacts/sql_model}
      SQL_TRAIN_JSONL_PATH: ${SQL_TRAIN_JSONL_PATH:-data/generated/sql_instruction_train.jsonl}
      SQL_EVAL_JSONL_PATH: ${SQL_EVAL_JSONL_PATH:-data/generated/sql_instruction_eval.jsonl}
      SQL_MODEL_USE_4BIT: ${SQL_MODEL_USE_4BIT:-true}
      SQL_MODEL_USE_WANDB: ${SQL_MODEL_USE_WANDB:-false}
      WANDB_PROJECT: ${WANDB_PROJECT:-insurance-sql-agent}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-128}
      EMBEDDING_NEGATIVE_SAMPLES: ${EMBEDDING_NEGATIVE_SAMPLES:-5}
      EMBEDDING_EPOCHS: ${EMBEDDING_EPOCHS:-20}
      EMBEDDING_MIN_TOKEN_FREQUENCY: ${EMBEDDING_MIN_TOKEN_FREQUENCY:-1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-512}
      EMBEDDING_LEARNING_RATE: ${EMBEDDING_LEARNING_RATE:-0.001}
      EMBEDDING_RANDOM_SEED: ${EMBEDDING_RANDOM_SEED:-2410}
      EMBEDDING_ARTIFACT_DIR: ${EMBEDDING_ARTIFACT_DIR:-artifacts/embedding_model}
      EMBEDDING_VOCAB_PATH: ${EMBEDDING_VOCAB_PATH:-artifacts/embedding_model/token_vocabulary.json}
      EMBEDDING_PREPROCESSING_METADATA_PATH: ${EMBEDDING_PREPROCESSING_METADATA_PATH:-artifacts/embedding_model/preprocessing_metadata.json}
      EMBEDDING_CONFIG_PATH: ${EMBEDDING_CONFIG_PATH:-artifacts/embedding_model/skipgram_config.json}
      EMBEDDING_TOKEN_EMBEDDINGS_PATH: ${EMBEDDING_TOKEN_EMBEDDINGS_PATH:-artifacts/embedding_model/token_embeddings.pt}
      CLAIM_VECTOR_OUTPUT_PATH: ${CLAIM_VECTOR_OUTPUT_PATH:-artifacts/claim_vectors/claim_vectors.json}
      SEMANTIC_SEARCH_DEFAULT_TOP_K: ${SEMANTIC_SEARCH_DEFAULT_TOP_K:-10}
      SEMANTIC_SEARCH_MAX_TOP_K: ${SEMANTIC_SEARCH_MAX_TOP_K:-50}
      SAMPLE_DATA_PATH: ${SAMPLE_DATA_PATH:-data/sample/insurance_sample.json}
      GENERATED_DATA_DIR: ${GENERATED_DATA_DIR:-data/generated}
      AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-huggingface_smolagents}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-local_falcon_adapter}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      AGENT_USE_BASE_TOOLS: ${AGENT_USE_BASE_TOOLS:-false}
      AGENT_REQUIRE_GROUNDED_EVIDENCE: ${AGENT_REQUIRE_GROUNDED_EVIDENCE:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
