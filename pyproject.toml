[project]
name = "sql-instruct-qlora-llm"
version = "0.1.0"
description = "AI agent for SQL generation and claim similarity search in insurance-fraud investigation workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Aditya S" }
]
dependencies = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.0",
  "datasets>=2.20.0",
  "einops>=0.8.0",
  "fastapi>=0.115.0",
  "matplotlib>=3.9.0",
  "numpy>=1.26.0",
  "peft>=0.12.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sentencepiece>=0.2.0",
  "smolagents[transformers]>=1.26.0",
  "sqlalchemy>=2.0.0",
  "sqlglot>=25.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.18.0",
  "uvicorn[standard]>=0.30.0",
  "wandb>=0.17.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
